# ---------- Web ----------
spring.application.name=InfyRail
server.port=8765
server.servlet.context-path=/InfyRail

# ---------- Database (schema: infyrail) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/infyrail?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / table generation ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql (sample data) after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- Logging ----------
logging.level.com.infosys=INFO
